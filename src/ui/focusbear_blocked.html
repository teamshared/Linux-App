<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocked by Focus Bear</title>
    <link rel="icon" href="https://focus-bear.github.io/assets/focus-blocked/images/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://focus-bear.github.io/assets/focus-blocked/styles/main.css"
    />
    <style>
      /* Additional styles for the blocking information */
      .block-info {
        background-color: #ffeaa7;
        padding: 15px;
        border-radius: 10px;
        margin: 20px 0;
        text-align: center;
      }
      
      .block-reason {
        font-weight: bold;
        color: #e74c3c;
      }
      
      .block-value {
        background-color: #fff;
        padding: 8px 12px;
        border-radius: 6px;
        margin-top: 10px;
        display: inline-block;
        font-family: monospace;
      }
    </style>
  </head>

  <body>
    <div id="container" class="container">
      <picture>
        <source
          srcset="
            https://focus-bear.github.io/assets/focus-blocked/images/FocusBearLogo.svg
          "
          type="image/svg+xml"
        />
        <source
          srcset="
            https://focus-bear.github.io/assets/focus-blocked/images/FocusBearLogo.webp
          "
          type="image/webp"
        />
        <source
          srcset="
            https://focus-bear.github.io/assets/focus-blocked/images/FocusBearLogo.png
          "
          type="image/png"
        />
        <img
          src="https://focus-bear.github.io/assets/focus-blocked/images/FocusBearLogo.png"
          alt="Focus Bear"
        />
      </picture>
      
      <div class="focusTitleWrapper">
        <h1 id="focusTitle">Let's keep the focus on your goals!</h1>
        <h3 id="focusSubTitle">This page has been blocked</h3>
        
        <div class="block-info">
          <p>Blocked due to: <span class="block-reason" id="blockReason">{block_type}</span></p>
          <p>Matched value: <span class="block-value" id="blockValue">{matched_value}</span></p>
        </div>
        
        <p id="focusAdditionalInfo">Take a deep breath and redirect your energy towards what matters most.</p>
        
        <div id="progressWrapper"></div>
      </div>

      <div id="privacyContainer">
        <h6 id="privacyNoticeContent" class="hide"></h6>
        <div id="privacyNoticeContentArrow" class="hide"></div>
        <button id="privacyBtn"></button>
      </div>
      
      <h3 id="focusTipWrapper">Tip: Try the Pomodoro technique for better focus!</h3>
    </div>

    <script src="https://focus-bear.github.io/assets/focus-blocked/js/moment_2.29.1.min.js"></script>
    <script src="https://focus-bear.github.io/assets/focus-blocked/js/utils.js"></script>
    <script>
      // Set the blocking information from URL parameters or placeholders
      document.addEventListener('DOMContentLoaded', function() {
        // Get the blocking reason from the URL or use the placeholder text
        const urlParams = new URLSearchParams(window.location.search);
        const blockReason = urlParams.get('reason') || document.getElementById('blockReason').textContent;
        const blockValue = urlParams.get('value') || document.getElementById('blockValue').textContent;
        
        // Update the display
        document.getElementById('blockReason').textContent = blockReason;
        document.getElementById('blockValue').textContent = blockValue;
        
        // Customize message based on block type
        if (blockReason === 'domain') {
          document.getElementById('focusSubTitle').textContent = 'This website has been blocked';
          document.getElementById('focusAdditionalInfo').textContent = 
            'This site is on your blocklist. Consider why you added it and refocus on your tasks.';
        } else if (blockReason === 'keyword') {
          document.getElementById('focusSubTitle').textContent = 'Content blocked due to restricted keyword';
          document.getElementById('focusAdditionalInfo').textContent = 
            'This page contains content that may distract you from your goals.';
        }
      });
    </script>
  </body>
</html>
