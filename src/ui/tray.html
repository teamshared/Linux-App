<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/tray.css">
</head>
<body>
    <div class="header">
        <div class="logo">🐻 focus bear</div>
    </div>
    
    <div class="mode-toggle">
        <button class="mode-btn geek">🤓 Geek Mode</button>
        <button class="mode-btn simple">😊 Simple Mode</button>
    </div>
    
    <div class="button-list">
        <button id="resume-habits" class="tray-button">
            Resume Habits
        </button>
        
        <button class="tray-button" onclick="openPreferences()">
            ⚙️ Preferences
        </button>
        
        <div class="info-row">
            <span>Limited blocking</span>
            <span class="icons">ℹ️ 🔶</span>
        </div>
        
        <button class="tray-button" onclick="openTodoList()">
            To Do List
        </button>
        
        <button id="focus-session" class="tray-button primary">
            ⏰ Start Focus Session
        </button>
        
        <button class="tray-button secondary" onclick="quit()">
            ⏸️ Quit
        </button>
        
        <button id="subscription" class="tray-button secondary">
            💰 Upgrade Now<br>
            <small>Your subscription has expired</small>
        </button>
    </div>
    
    <script src="../electron/tray.js"></script>
</body>
</html>
