<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Bear — Extension Warning</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: #16213e;
      border: 1px solid #e53e3e;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      width: 100%;
      max-width: 440px;
    }

    .icon { margin-bottom: 20px; }
    .icon img {
      width: 280px;
      height: 100px;
      object-fit: contain;
      background: white;
      border-radius: 16px;
      padding: 12px 24px;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      color: #fc8181;
      margin-bottom: 12px;
    }

    p {
      font-size: 14px;
      color: #a0aec0;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .countdown {
      font-size: 48px;
      font-weight: 800;
      color: #fc8181;
      margin: 20px 0;
    }

    .hint {
      font-size: 12px;
      color: #718096;
      margin-bottom: 24px;
    }

    button {
      background: #e53e3e;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }

    button:hover { background: #c53030; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <picture>
        <source srcset="https://focus-bear.github.io/assets/focus-blocked/images/FocusBearLogo.svg" type="image/svg+xml" />
        <source srcset="https://focus-bear.github.io/assets/focus-blocked/images/FocusBearLogo.webp" type="image/webp" />
        <img src="https://focus-bear.github.io/assets/focus-blocked/images/FocusBearLogo.png" alt="Focus Bear" />
      </picture>
    </div>
    <h1>Extension Disconnected</h1>
    <p>The Focus Bear <span class="browser-name"></span> extension is not active.<br><span class="browser-name"></span> will be closed to protect your focus session.</p>
    <div class="countdown" id="countdown">30</div>
    <p class="hint">Re-enable the extension in <span class="browser-name"></span> to dismiss this warning.</p>
    <button id="closeNow">Close <span class="browser-name"></span> Now</button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const browserName = new URLSearchParams(window.location.search).get('browser') || 'your browser';
    document.querySelectorAll('.browser-name').forEach(el => { el.textContent = browserName; });

    let seconds = 30;
    const el = document.getElementById('countdown');

    const interval = setInterval(() => {
      seconds--;
      el.textContent = seconds;
      if (seconds <= 0) clearInterval(interval);
    }, 1000);

    document.getElementById('closeNow').addEventListener('click', () => {
      ipcRenderer.send('extension-warning-close-browser');
    });
  </script>
</body>
</html>
